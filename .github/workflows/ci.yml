name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Only the light deps are needed for the deterministic tests; the heavy ML/LLM
      # path is exercised locally. CI stays fast and key-free on purpose.
      - name: Install test deps
        run: pip install pydantic pytest requests tenacity
      - name: Run unit tests (filters + feedback)
        run: python -m pytest tests/test_filters.py tests/test_feedback.py -q
